name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'choose tests set'
        required: true
        type: choice
        default: 'smoke'
        options:
          - smoke
          - regression
          - extended
          - all

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required for Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- ЭТАП 1: Запуск тестов ---
      - name: run all tests
        if: github.event.inputs.deployment_target == 'all'
        env:
          PYTHONPATH: .
        run: pytest --alluredir=allure-results

      - name: run smoke tests
        if: github.event.inputs.deployment_target == 'smoke'
        env:
          PYTHONPATH: .
        run: pytest -m smoke --alluredir=allure-results

      - name: run regression tests
        if: github.event.inputs.deployment_target == 'regression'
        env:
          PYTHONPATH: .
        run: pytest -m regression --alluredir=allure-results

      - name: run extended tests
        if: github.event.inputs.deployment_target == 'extended'
        env:
          PYTHONPATH: .
        run: pytest -m extended --alluredir=allure-results

      # --- ЭТАП 2: Сборка истории и отчета ---
      - name: Install Allure CLI
        if: always()
        run: sudo npm install -g allure-commandline --save-dev

      - name: Download previous Allure history from GitHub Pages
        if: always()
        continue-on-error: true
        run: |
          artifact_url="https://api.github.com/repos/${{ github.repository }}/pages/builds/latest"
          # Скачиваем текущую папку history из предыдущего сайта, если он существует
          mkdir -p allure-results/history
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/history.json -o allure-results/history/history.json || true
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/history-trend.json -o allure-results/history/history-trend.json || true
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/categories-trend.json -o allure-results/history/categories-trend.json || true
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/duration-trend.json -o allure-results/history/duration-trend.json || true
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/retry-trend.json -o allure-results/history/retry-trend.json || true

      - name: Generate report
        if: always()
        run: allure generate allure-results --clean -o _site

      - name: Save allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: _site
          retention-days: 1

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish-report:
    name: Report publication
    runs-on: ubuntu-24.04
    needs: run-tests
    if: always()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
