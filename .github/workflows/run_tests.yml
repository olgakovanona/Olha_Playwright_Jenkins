name: Python autotest

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Choose test set'
        required: true
        type: choice
        default: 'smoke'
        options:
          - smoke
          - regression
          - extended
          - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run_test:
    runs-on: ubuntu-24.04
    name: Run autotests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required for Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- ЭТАП 1: Запуск тестов ---
      - name: Run all tests
        if: github.event.inputs.deployment_target == 'all'
        env:
          PYTHONPATH: .
        run: pytest --alluredir=allure-results

      - name: Run smoke tests
        if: github.event.inputs.deployment_target == 'smoke'
        env:
          PYTHONPATH: .
        run: pytest -m smoke --alluredir=allure-results

      - name: Run regression tests
        if: github.event.inputs.deployment_target == 'regression'
        env:
          PYTHONPATH: .
        run: pytest -m regression --alluredir=allure-results

      - name: Run extended tests
        if: github.event.inputs.deployment_target == 'extended'
        env:
          PYTHONPATH: .
        run: pytest -m extended --alluredir=allure-results

      # --- ЭТАП 2: Сборка и сохранение Allure отчета ---
      - name: Install Allure CLI
        if: always()
        run: sudo npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Save Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          retention-days: 1
